name: Fetch gigs

on:
  schedule:
    - cron:  '0 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'scraper.rb'
      - '.github/workflows/scrape.yaml'

env:
  TZ: "Europe/Oslo"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true
      - run: bundle install
      - run: bundle exec ruby scraper.rb
      - name: Save gigs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/events/
          git commit -am "ci: Retrieved new gigs"
          git push
