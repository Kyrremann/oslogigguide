name: Deploy Scaleway Function

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
      function-id:
        required: true
        type: string
    secrets:
      scaleway-token:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create zip
        working-directory: ${{ inputs.directory }}
        run: |
          zip -r function.zip Cargo.lock Cargo.toml src/

      - name: Deploy to Scaleway
        env:
          SCW_SECRET_KEY: ${{ secrets.scaleway-token }}
          FUNCTION_ID: ${{ inputs.function-id }}
        working-directory: ${{ inputs.directory }}
        run: |
          set -euo pipefail

          ZIP_FILE="function.zip"
          CONTENT_LENGTH=$(stat -c%s "$ZIP_FILE")
          REGION="nl-ams"
          API_BASE="https://api.scaleway.com/functions/v1beta1/regions/${REGION}/functions/${FUNCTION_ID}"

          # Resolve latest available Rust runtime and update function if changed
          RUNTIMES_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            "https://api.scaleway.com/functions/v1beta1/regions/${REGION}/runtimes" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}")

          RUNTIMES_HTTP=$(echo "$RUNTIMES_RESPONSE" | tail -1)
          RUNTIMES_BODY=$(echo "$RUNTIMES_RESPONSE" | sed '$d')

          if [ "$RUNTIMES_HTTP" -lt 200 ] || [ "$RUNTIMES_HTTP" -ge 300 ]; then
            echo "::error::Failed to fetch runtimes (HTTP ${RUNTIMES_HTTP}): ${RUNTIMES_BODY}"
            exit 1
          fi

          LATEST_RUNTIME=$(echo "$RUNTIMES_BODY" | jq -r '
            .runtimes
            | map(select(.name | startswith("rust")) | select(.status == "available"))
            | sort_by(.name)
            | last
            | .name
          ')

          if [ -z "$LATEST_RUNTIME" ] || [ "$LATEST_RUNTIME" = "null" ]; then
            echo "::error::Could not determine latest Rust runtime"
            exit 1
          fi

          echo "Latest available Rust runtime: ${LATEST_RUNTIME}"

          # Fetch current function config to compare runtime
          FUNC_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            "${API_BASE}" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}")

          FUNC_HTTP=$(echo "$FUNC_RESPONSE" | tail -1)
          FUNC_BODY=$(echo "$FUNC_RESPONSE" | sed '$d')

          if [ "$FUNC_HTTP" -lt 200 ] || [ "$FUNC_HTTP" -ge 300 ]; then
            echo "::error::Failed to fetch function config (HTTP ${FUNC_HTTP}): ${FUNC_BODY}"
            exit 1
          fi

          CURRENT_RUNTIME=$(echo "$FUNC_BODY" | jq -r '.runtime')

          if [ "$CURRENT_RUNTIME" != "$LATEST_RUNTIME" ]; then
            echo "::warning::Runtime changed from '${CURRENT_RUNTIME}' to '${LATEST_RUNTIME}' — updating function"
            PATCH_RESPONSE=$(curl -sS -w "\n%{http_code}" -X PATCH \
              "${API_BASE}" \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"runtime\": \"${LATEST_RUNTIME}\", \"redeploy\": false}")

            PATCH_HTTP=$(echo "$PATCH_RESPONSE" | tail -1)
            PATCH_BODY=$(echo "$PATCH_RESPONSE" | sed '$d')

            if [ "$PATCH_HTTP" -lt 200 ] || [ "$PATCH_HTTP" -ge 300 ]; then
              echo "::error::Failed to update runtime (HTTP ${PATCH_HTTP}): ${PATCH_BODY}"
              exit 1
            fi

            echo "✓ Runtime updated to ${LATEST_RUNTIME}"
          else
            echo "✓ Runtime already at latest (${CURRENT_RUNTIME})"
          fi

          # Get presigned upload URL
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            "${API_BASE}/upload-url?content_length=${CONTENT_LENGTH}" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Upload URL request failed (HTTP ${HTTP_CODE}): ${BODY}"
            exit 1
          fi

          UPLOAD_URL=$(echo "$BODY" | jq -r '.url')

          # Upload zip
          curl -sSf -X PUT "$UPLOAD_URL" \
            --upload-file "$ZIP_FILE" \
            -H "Content-Type: application/octet-stream"

          echo "✓ Uploaded $ZIP_FILE"

          # Trigger deployment
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "${API_BASE}/deploy" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Deploy request failed (HTTP ${HTTP_CODE}): ${BODY}"
            exit 1
          fi

          echo "✓ Deployed (status: $(echo "$BODY" | jq -r '.status'))"

          # Wait for deployment to reach a terminal state
          echo "Waiting for deployment to complete..."
          MAX_WAIT=600
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            RESPONSE=$(curl -sS -w "\n%{http_code}" \
              "${API_BASE}" \
              -H "X-Auth-Token: ${SCW_SECRET_KEY}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::warning::Status poll failed (HTTP ${HTTP_CODE}), retrying..."
              continue
            fi

            STATUS=$(echo "$BODY" | jq -r '.status')
            BUILD_MSG=$(echo "$BODY" | jq -r '.build_message // empty')
            echo "  status: ${STATUS}${BUILD_MSG:+ | ${BUILD_MSG}} (${ELAPSED}s elapsed)"

            if [ "$STATUS" = "ready" ]; then
              echo "✓ Deployment succeeded"
              exit 0
            elif [ "$STATUS" = "error" ] || [ "$STATUS" = "locked" ]; then
              ERROR_MSG=$(echo "$BODY" | jq -r '.error_message // "unknown error"')
              echo "::error::Deployment failed with status '${STATUS}': ${ERROR_MSG}"
              exit 1
            fi
          done

          echo "::error::Timed out waiting for deployment after ${MAX_WAIT}s"
          exit 1
