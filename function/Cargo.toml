[package]
name = "oslogigguide"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/handler.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
git2 = { version = "0.21", features = ["vendored-openssl"] }
env_logger = "0.11"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
